[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jwst-redux"
version = "0.1.0.dev0"
description = "A thin orchestration layer for retrieving JWST data from MAST and running the official JWST calibration pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Benjamin V. Rackham"}
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astroquery",
  "astropy",
  "jwst",
  "PyYAML",
  "typer>=0.12",
  "rich",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
]

[project.scripts]
jwst-redux = "jwst_redux.cli:app"

[project.urls]
Homepage = "https://github.com/brackham/jwst-redux"
Repository = "https://github.com/brackham/jwst-redux"
Issues = "https://github.com/brackham/jwst-redux/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

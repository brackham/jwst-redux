project:
  name: toi3884-all-soss

query:
  # All public NIRISS/NIS_SOSS science data archived under either validated name.
  target: TOI-3884
  target_match: mast_targname
  archive_target_names:
    - TOI-3884
    - TOI-3884b
  instrument: NIRISS
  exposure_type: NIS_SOSS
  proposal_ids:
    - 5799
    - 5863
  observation_id: null
  visit_id: null

products:
  start_from: uncal

pipeline:
  stages: auto
  # planned/auto uses metadata-resolved endpoints separately for every branch.
  endpoint: planned
  crds_context: auto
  overrides: {}
  spec2_overrides: {}
  tso3_overrides: {}

output:
  # Intentionally matches the validated GO-5799 workspace root for reuse.
  root: ./work/toi3884
  save_intermediate: true

options:
  overwrite: false
  dry_run: false
  # Attempt later independent branches after a branch failure; exit nonzero at the end.
  batch_failure_policy: continue

qa:
  enabled: true
  soss:
    wavelength_windows:
      1: [0.85, 2.83]
      2: [0.60, 1.00]
      3: [0.70, 0.95]

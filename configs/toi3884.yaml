project:
  name: toi3884-soss

query:
  target: TOI-3884
  target_match: mast_targname
  archive_target_names:
    - TOI-3884
    - TOI-3884b
  instrument: NIRISS
  exposure_type: NIS_SOSS
  # null searches all proposals; a single ID or a list of IDs may be supplied.
  proposal_ids: null
  observation_id: null
  visit_id: null

products:
  start_from: uncal

stage1:
  selection:
    # GO-5799 Obs 002 / Visit 001 / Exposure 04101
    program_id: 5799
    observation_id: 2
    visit_number: 1
    exposure_number: "04101"
    exposure_id: jw05799002001_04101_00001

pipeline:
  stages: auto
  # auto uses the context selected for the installed jwst pipeline by CRDS.
  crds_context: auto
  overrides: {}
  spec2_overrides: {}
  tso3_overrides: {}

output:
  root: ./work/toi3884
  save_intermediate: true

options:
  overwrite: false
  dry_run: false

qa:
  # Derived inspection products; failures do not invalidate calibration outputs.
  enabled: true
  soss:
    # Spectroscopic-time-series display windows in microns; bad channels remain gray within them.
    wavelength_windows:
      1: [0.85, 2.83]
      2: [0.60, 1.00]
      3: [0.70, 0.95]

# This explicit selector processes every validated segment of the exposure in order.

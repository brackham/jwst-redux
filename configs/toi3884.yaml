project:
  name: toi3884-soss

query:
  target: TOI-3884
  target_match: mast_targname
  archive_target_names:
    - TOI-3884
    - TOI-3884b
  instrument: NIRISS
  exposure_type: NIS_SOSS
  # null searches all proposals; a single ID or a list of IDs may be supplied.
  proposal_ids: null
  observation_id: null
  visit_id: null

products:
  start_from: uncal

stage1:
  selection:
    program_id: 5799
    observation_id: 1
    visit_number: 1
    exposure_id: jw05799001001_04101_00001

pipeline:
  stages: auto
  # auto uses the context selected for the installed jwst pipeline by CRDS.
  crds_context: auto
  overrides: {}
  spec2_overrides: {}
  tso3_overrides: {}

output:
  root: ./work/toi3884
  save_intermediate: true

options:
  overwrite: false
  dry_run: false

qa:
  # Derived inspection products; failures do not invalidate calibration outputs.
  enabled: true

# This explicit selector processes every validated segment of the exposure in order.

project:
  name: toi3884-soss

query:
  target: TOI-3884
  target_match: mast_targname
  archive_target_names:
    - TOI-3884
    - TOI-3884b
  instrument: NIRISS
  exposure_type: NIS_SOSS
  # null searches all proposals; a single ID or a list of IDs may be supplied.
  proposal_ids: null
  observation_id: null
  visit_id: null

products:
  start_from: uncal

pipeline:
  stages: auto
  crds_context: latest
  overrides: {}

output:
  root: ./work/toi3884
  save_intermediate: true

options:
  overwrite: false
  dry_run: false


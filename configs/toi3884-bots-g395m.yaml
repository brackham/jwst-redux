project:
  name: toi3884-bots-g395m

query:
  # First NIRSpec/BOTS acceptance case: the single-science-detector G395M visit.
  target: TOI-3884
  target_match: mast_targname
  archive_target_names:
    - TOI-3884
    - TOI-3884b
  instrument: NIRSPEC
  exposure_type: NRS_BRIGHTOBJ
  proposal_ids:
    - 5863
  observation_id: "002"
  visit_id: null

products:
  start_from: uncal

pipeline:
  stages: auto
  endpoint: planned
  crds_context: auto
  overrides: {}
  spec2_overrides: {}
  tso3_overrides: {}

output:
  root: ./work/toi3884-bots
  save_intermediate: true

options:
  overwrite: false
  dry_run: false
  batch_failure_policy: continue

qa:
  enabled: true
